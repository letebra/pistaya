# Manté actiu el projecte de Supabase (el pla gratuït el pausa després de 7 dies sense ús):
# cada dia fa una consulta real a l'API, que llegeix de la base de dades.
name: Keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS https://pistaya-five.vercel.app/api/installacions -o /dev/null
